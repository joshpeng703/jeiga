<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- EDIT: post title, then your name -->
  <title>Post title | Your Name</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <!-- HOW TO USE: make a copy of this file in the posts folder, give it a
       simple name like my-first-post.html, write your post, then add a
       link to it in the Writing list in index.html. -->
  <header>
    <a href="../safetyisms.html">&larr; Back</a>
  </header>
  <main>
    <article class="post">
      <h1>Post title</h1>
      <p class="entry-date">Month Year</p>

      <p>Write your first paragraph here.</p>
      <p>Each paragraph goes inside its own pair of p tags.</p>

      <h2>A subheading, if you want one</h2>
      <p>More text. A link looks like this: <a href="https://example.com">words people click</a>.</p>
    </article>
  </main>
</body>
</html>
